name: Extract llama-server

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-22.04
    steps:
      - name: Pull image
        run: docker pull ezforever/llama.cpp-static:server-ssl-avx2

      - name: Export container filesystem
        run: |
          # 创建容器但不启动
          docker create --name tmp ezforever/llama.cpp-static:server-ssl-avx2
          # 将容器文件系统导出为 tar 包
          docker export tmp -o container.tar
          # 从 tar 包中查找并提取 llama-server 文件
          tar -xvf container.tar --wildcards '*llama-server'
          # 查找提取出来的文件，确认位置
          find . -name "llama-server" -type f
          # 清理临时容器
          docker rm tmp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server
          path: llama-server
